# Xiyu Ke's academic website. Restart Jekyll after changing this file.
locale: en-US
title: Xiyu Ke
name: Xiyu Ke
title_separator: "·"
description: "Xiyu Ke is an M.S. student at Rutgers working on robotic manipulation, robot learning, fine-grained grasping, and contact-aware motion planning."
url: https://ra1ncn.github.io
baseurl: ""
repository: Ra1ncn/Ra1ncn.github.io
site_theme: default

author:
  name: Xiyu Ke
  bio: Robotic manipulation, robot learning, and contact-aware motion planning
  location: New Brunswick, NJ, USA
  employer: Rutgers University
  email: xiyu.ke@rutgers.edu
  github: Ra1ncn

include:
  - _pages
  - CV

# Preserve the original theme sources locally, but do not publish demo content.
exclude:
  - .bundle
  - .github
  - .devcontainer
  - .jekyll-cache
  - .sass-cache
  - vendor
  - node_modules
  - local
  - tmp
  - scripts
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - Dockerfile
  - docker-compose.yaml
  - LICENSE
  - README.md
  - CV/Academic_CV1.pdf
  - CV/Academic_CV2.pdf
  - CV/Academic_CV3.pdf
  - assets/videos/clear1.mp4
  - assets/videos/clear2.mp4
  - assets/videos/README.md
  - assets/fonts/notebook/README.md
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - files
  - _posts
  - _drafts
  - _publications
  - _talks
  - _teaching
  - _portfolio/portfolio-1.md
  - _portfolio/portfolio-2.html
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/page-archive.html
  - _pages/tag-archive.html
  - _pages/talkmap.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/terms.md
  - _pages/year-archive.html
  - images/themes
  - images/wiki
  - images/editing-talk.png
  - assets/css/main.scss
  - assets/css/fontawesome.scss
  - assets/css/academicons.css
  - assets/css/academicons.min.css
  - assets/js/main.min.js
  - assets/js/_main.js
  - assets/js/theme.js
  - assets/js/plugins
  - assets/webfonts
  - assets/fonts/academicons.eot
  - assets/fonts/academicons.ttf
  - assets/fonts/academicons.woff
  - assets/fonts/academicons.svg

collections:
  portfolio:
    output: true
    permalink: /research/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: notebook
  - scope:
      path: ""
      type: portfolio
    values:
      layout: project

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
encoding: utf-8
future: false
timezone: America/New_York
permalink: /:categories/:title/
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
